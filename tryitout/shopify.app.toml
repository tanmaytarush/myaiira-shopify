# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "e9e8392f9b38ee2bc3659802d82355b9"
name = "tryitout"
application_url = "https://ai.talentool.in"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-07"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_products,write_app_proxy,read_themes,write_themes"

[product.metafields.custom.vto_outfit_products]
name = "VTO look pieces"
description = "Catalog products in this look (upperwear, lowerwear, footwear, etc.)"
type = "list.product_reference"
access.admin = "merchant_read_write"
access.storefront = "public_read"

[product.metafields.custom.vto_swap_pool]
name = "VTO swap pool"
description = "Extra catalog products shoppers can swap in when building combinations"
type = "list.product_reference"
access.admin = "merchant_read_write"
access.storefront = "public_read"

[product.metafields.custom.vto_sub_type]
name = "VTO garment type"
description = "Garment slot for virtual try-on (upperwear, lowerwear, footwear, bracelet, …)"
type = "single_line_text_field"
access.admin = "merchant_read_write"
access.storefront = "public_read"
validations.choices = [
  "upperwear",
  "lowerwear",
  "footwear",
  "bracelet",
  "handbag",
  "earrings",
  "necklace",
  "dress",
  "top",
  "bottom",
  "saree",
  "kurta",
  "kurti",
  "lehenga",
  "dupatta",
  "blouse",
  "default",
]

[auth]
redirect_urls = [
  "https://ai.talentool.in/auth/callback",
  "https://ai.talentool.in/auth/shopify/callback",
]

[app_proxy]
url = "https://ai.talentool.in/webhook"
subpath = "myaiira"
prefix = "apps"
