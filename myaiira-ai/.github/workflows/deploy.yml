name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: write

jobs:
  # ─────────────── TEST ───────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio pytest-cov python-dotenv moto boto3
          pip install -r layers/common/requirements.txt

      - name: Run unit tests
        run: pytest tests/unit/ -v --cov=lambdas --cov=layers --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: coverage.xml

  # ─────────────── SEMANTIC VERSION ───────────────
  # Only runs on main
  version:
    name: Bump Version & Release
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      new_version: ${{ steps.semver.outputs.new_version }}
      changelog_entry: ${{ steps.semver.outputs.changelog_entry }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version bump from commit message
        id: semver
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          CURRENT=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          MAJOR=$(echo $CURRENT | cut -d. -f1 | tr -d v)
          MINOR=$(echo $CURRENT | cut -d. -f2)
          PATCH=$(echo $CURRENT | cut -d. -f3)

          if echo "$COMMIT_MSG" | grep -q "BREAKING CHANGE\|major:"; then
            NEW="v$((MAJOR+1)).0.0"
          elif echo "$COMMIT_MSG" | grep -q "^feat"; then
            NEW="v${MAJOR}.$((MINOR+1)).0"
          else
            NEW="v${MAJOR}.${MINOR}.$((PATCH+1))"
          fi

          echo "new_version=$NEW" >> $GITHUB_OUTPUT
          echo "current_version=$CURRENT" >> $GITHUB_OUTPUT

          ENTRY="## $NEW — $(date '+%Y-%m-%d')\n\n"
          COMMITS=$(git log ${CURRENT}..HEAD --pretty="- %s (%h)" 2>/dev/null || git log --pretty="- %s (%h)" -5)
          echo -e "changelog_entry<<EOF" >> $GITHUB_OUTPUT
          echo -e "$ENTRY$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update CHANGELOG.md
        run: |
          ENTRY="${{ steps.semver.outputs.changelog_entry }}"
          VERSION="${{ steps.semver.outputs.new_version }}"

          if [ -f CHANGELOG.md ]; then
            EXISTING=$(tail -n +2 CHANGELOG.md)
            echo "# myaiira-ai — Changelog" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo -e "$ENTRY" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "$EXISTING" >> CHANGELOG.md
          else
            echo "# myaiira-ai — Changelog" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo -e "$ENTRY" >> CHANGELOG.md
          fi

      - name: Commit CHANGELOG and tag
        run: |
          VERSION="${{ steps.semver.outputs.new_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore: release $VERSION [skip ci]" || echo "No changelog changes"
          git tag $VERSION
          git push origin main --tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semver.outputs.new_version }}
          name: ${{ steps.semver.outputs.new_version }}
          body: ${{ steps.semver.outputs.changelog_entry }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────── DEPLOY DEV ───────────────
  # Triggered on push to dev branch only
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: aws-actions/setup-sam@v2

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Build
        run: sam build

      - name: Deploy to dev
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: sam deploy --config-env dev --no-confirm-changeset --no-fail-on-empty-changeset

  # ─────────────── DEPLOY PROD ───────────────
  # Triggered on push to main branch only, after version bump
  deploy-prod:
    name: Deploy to Prod
    runs-on: ubuntu-latest
    needs: version
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: aws-actions/setup-sam@v2

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Build
        run: sam build

      - name: Deploy to prod
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: sam deploy --config-env prod --no-confirm-changeset --no-fail-on-empty-changeset